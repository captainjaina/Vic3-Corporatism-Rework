 rise_of_fascism.1.t: "The March on the Capital"
 rise_of_fascism.1.d: "Tens of thousands of uniformed militants have converged on the capital's rail hubs and ministries, paralyzing the government and demanding full executive authority."
 rise_of_fascism.1.f: ""The old parliamentary world has abdicated. Either hand over the keys of the state today, or we shall take them over the ruins of your ministries.""
 rise_of_fascism.1.a: "Capitulate to the ultimatum and form a new government."
 rise_of_fascism.1.b: "Refuse their demands—order the garrison to defend the capital!"

 rise_of_fascism.2.t: "Street War Escalates"
 rise_of_fascism.2.d: "Armed fascist squads have launched coordinated attacks on union halls and rival newspapers across major industrial cities, leaving local police overwhelmed."
 rise_of_fascism.2.f: ""They claim to restore order with clubs and castor oil, yet every street corner looks more like a battlefield.""
 rise_of_fascism.2.a: "Prosecute the ringleaders and restore the rule of law."
 rise_of_fascism.2.b: "Look the other way—they are doing the state's dirty work."

 rise_of_fascism.3.t: "Captains of Industry Hedge Their Bets"
 rise_of_fascism.3.d: "Intelligence reports reveal that prominent industrialists are secretly funneling millions into fascist paramilitary coffers in exchange for promises to crush labor unions."
 rise_of_fascism.3.f: ""Better a strongman in a uniform than a red flag flying over the factory gates.""
 rise_of_fascism.3.a: "Expose the slush funds and prosecute the donors."
 rise_of_fascism.3.b: "Quietly permit the arrangement to stabilize industry."

 rise_of_fascism.4.t: "Demands for the Interior Ministry"
 rise_of_fascism.4.d: "Emboldened by their seat in the governing coalition, fascist ministers have issued an ultimatum demanding control of the police and internal security apparatus."
 rise_of_fascism.4.f: ""A government that cannot control the streets cannot govern at all.""
 rise_of_fascism.4.a: "Refuse and expel them from the coalition!"
 rise_of_fascism.4.b: "Hand over the ministries to preserve the coalition."