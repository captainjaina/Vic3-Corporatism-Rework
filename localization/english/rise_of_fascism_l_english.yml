 je_rise_of_fascism_ban_paramilitaries: "Ban Party Paramilitaries"
 je_rise_of_fascism_ban_paramilitaries_desc: "Deploy police and state administrators to outlaw uniformed militias, raid party headquarters, and arrest street agitators—risking backlash from nationalist middle classes and sympathetic officers."
 je_rise_of_fascism_emergency_relief: "Enact Emergency Relief Programs"
 je_rise_of_fascism_emergency_relief_desc: "Fund public works and social relief to dry up the economic despair fueling extremism, at heavy cost to the treasury and the patience of wealthy elites."
 je_rise_of_fascism_backroom_bargain: "Strike a Backroom Bargain"
 je_rise_of_fascism_backroom_bargain_desc: "Bring fascist leaders into backroom political arrangements to crush left-wing agitation, knowing they will cannibalize their conservative partners from within."
 je_rise_of_fascism_deputize_squads: "Deputize Auxiliary "Order" Squads"
 je_rise_of_fascism_deputize_squads_desc: "Grant fascist paramilitaries quasi-official police powers to break strikes and intimidate opponents, surrendering the state's monopoly on violence."

