 je_white_terror: "The White Terror"
 je_white_terror_reason: "Seizing the ministries is only the beginning. Trade unions, universities, rival parties, and hesitant institutions still resist the new order. Through tribunals, purges, and forced coordination, every pillar of society must be brought to heel."

 white_terror_progress_bar: "Regime Consolidation"
