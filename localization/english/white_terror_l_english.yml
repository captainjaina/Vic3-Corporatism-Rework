 white_terror.1.t: "Special Tribunals & Show Trials"
 white_terror.1.d: "Thousands of opposition organizers, journalists, and former deputies fill our detention centers. Security chiefs demand special summary tribunals to make an example of them."
 white_terror.1.f: ""Law is no longer a shield for traitors; it is the sword of the state.""
 white_terror.1.a: "Authorize full summary tribunals."
 white_terror.1.b: "Keep them in quiet administrative detention instead."

 white_terror.2.t: "The General Staff Demands Immunity"
 white_terror.2.d: "Senior commanders of the Armed Forces have quietly informed the government that they will maintain order on the streets only if party commissars stay out of the barracks."
 white_terror.2.f: ""The army serves the nation—not party upstarts in colored shirts.""
 white_terror.2.a: "Guarantee the General Staff's institutional autonomy."
 white_terror.2.b: "Refuse—subordinate the officer corps to the movement!"

 white_terror.3.t: "Concordat or Kulturkampf"
 white_terror.3.d: "Clerical leaders remain wary of the regime's totalitarian ambitions, particularly regarding youth organizations and confessional schools."
 white_terror.3.f: ""Render unto Caesar what is Caesar's—so long as Caesar respects the sanctuary.""
 white_terror.3.a: "Negotiate a pragmatic Concordat with the Devout."
 white_terror.3.b: "Seize confessional schools and youth leagues for the state."