 je_white_terror_smash_underground: "Smash the Red & Liberal Underground"
 je_white_terror_smash_underground_desc: "Dissolve independent unions, purge universities, and install compliant regime puppets at the head of the Trade Unions and Intelligentsia—at the cost of severe factory unrest and intellectual brain drain."
 je_white_terror_coopt_elites: "Co-opt the Economic & Landed Elites"
 je_white_terror_coopt_elites_desc: "Bind Industrialists and Landowners to the regime through corporatist charters and state contracts, trading working-class resentment and oligarchic influence for elite alignment."
 je_white_terror_subordinate_sword_altar: "Subordinate the Sword & Altar"
 je_white_terror_subordinate_sword_altar_desc: "Compel the Armed Forces and Devout to swear ideological loyalty to the regime's leadership, risking an institutional crisis if they already distrust the government."
 je_white_terror_settle_accounts: "Settle Accounts Within the Movement"
 je_white_terror_settle_accounts_desc: "Launch a ruthless internal purge against rival fascist factions to impose absolute ideological uniformity across the state."

