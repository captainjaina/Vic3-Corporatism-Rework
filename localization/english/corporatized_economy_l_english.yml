 # Repeatable Selection, Outcome & Milestone Events
 corporatized_economy.5.t: "Four Year Plan #[GetPlayer.MakeScope.Var('four_year_plan_number').GetValue|0]: Strategic Directive"
 corporatized_economy.5.d: "With the previous planning cycle concluded and reviewed, the State Planning Commission has convened to chart the nation's next forty-eight-month directive. Ministers, syndicate chiefs, and military representatives await your decision on which pillar of national strength should take priority."
 corporatized_economy.5.f: "\"A planned economy never rests upon past laurels; each completed blueprint is merely the foundation for the next.\""
 corporatized_economy.5.a: "Industrial Expansion — Strengthen our productive base."
 corporatized_economy.5.a.tt: "Proceed to select a specialized #v Industrial Sector#! focus."
 corporatized_economy.5.b: "Standard of Living — Elevate the prosperity of our citizens."
 corporatized_economy.5.b.tt: "Launches #v Four Year Plan #[GetPlayer.MakeScope.Var('four_year_plan_number').GetValue|0]: Standard of Living#!."
 corporatized_economy.5.c: "Army Expansion — Forge a formidable standing force."
 corporatized_economy.5.c.tt: "Launches #v Four Year Plan #[GetPlayer.MakeScope.Var('four_year_plan_number').GetValue|0]: Army Expansion#!."
 corporatized_economy.5.e: "We are not ready to commit to a new plan yet."
 corporatized_economy.5.e.tt: "Closes the commission without starting a plan. You may convene it again at any time."

 corporatized_economy.6.t: "Four Year Plan #[GetPlayer.MakeScope.Var('four_year_plan_number').GetValue|0]: Industrial Focus"
 corporatized_economy.6.d: "Having prioritized industrial expansion for the upcoming forty-eight-month cycle, the State Planning Commission requests specific guidance on which sector of the economy should receive primary state coordination and capital allocation."
 corporatized_economy.6.f: "\"Steel, rifles, railways, or daily bread—tell the syndicates where to turn the lathes.\""
 corporatized_economy.6.a: "General Economic Growth — Expand GDP and national railways."
 corporatized_economy.6.a.tt: "Launches #v Four Year Plan #[GetPlayer.MakeScope.Var('four_year_plan_number').GetValue|0]: General Economic Growth#!."
 corporatized_economy.6.b: "Military Industry — Expand arms, artillery, and munitions plants."
 corporatized_economy.6.b.tt: "Launches #v Four Year Plan #[GetPlayer.MakeScope.Var('four_year_plan_number').GetValue|0]: Military Industry#!."
 corporatized_economy.6.c: "Civilian Sector — Expand food, clothing, and furniture factories."
 corporatized_economy.6.c.tt: "Launches #v Four Year Plan #[GetPlayer.MakeScope.Var('four_year_plan_number').GetValue|0]: Civilian Sector#!."
 corporatized_economy.6.e: "Heavy Industry — Expand steel mills, tooling, and motor industries."
 corporatized_economy.6.e.tt: "Launches #v Four Year Plan #[GetPlayer.MakeScope.Var('four_year_plan_number').GetValue|0]: Heavy Industry#!."
 corporatized_economy.6.g: "Reconsider the overarching strategic directive."

 corporatized_economy.7.t: "Four Year Plan #[GetPlayer.MakeScope.Var('four_year_plan_number').GetValue|0] Ratified"
 corporatized_economy.7.d: "The State Planning Commission has formally ratified Four Year Plan #[GetPlayer.MakeScope.Var('four_year_plan_number').GetValue|0]. Production targets have been indexed to current national capacity, and all state ministries and syndicates have been placed on a strict forty-eight-month schedule."
 corporatized_economy.7.f: "\"The quotas are set, the ledger is open, and forty-eight months stand between blueprint and reality.\""
 corporatized_economy.7.a: "Carry out the directive."
 corporatized_economy.7.a.tt: "Open the #v Journal#! to track #v Four Year Plan #[GetPlayer.MakeScope.Var('four_year_plan_number').GetValue|0]#!."

 corporatized_economy.8.t: "Four Year Plan Fulfilled"
 corporatized_economy.8.d: "After forty-eight months of coordinated execution, the State Planning Commission has certified that the targets of our Four Year Plan have been met in full. The commission will now enter a six-month review period before drafting the next national directive."
 corporatized_economy.8.f: "\"Another milestone achieved through discipline, coordination, and national purpose.\""
 corporatized_economy.8.a: "Well executed."

 corporatized_economy.9.t: "Four Year Plan Unfulfilled"
 corporatized_economy.9.d: "The latest Four Year Plan has concluded without meeting its mandated targets or maintaining the required corporatist framework. Public confidence has been shaken, and the State Planning Commission will spend the next six months auditing the shortfalls before proposing a new plan."
 corporatized_economy.9.f: "\"Unmet quotas leave bitter lessons in the ledgers of the state.\""
 corporatized_economy.9.a: "Audit the failures and prepare to recover."

 corporatized_economy.10.t: "The [ROOT.GetCountry.GetAdjectiveNoFormatting] Economic Miracle"
 corporatized_economy.10.d: "With the successful completion of five consecutive Four Year Plans, [ROOT.GetCountry.GetName] has achieved an unprecedented transformation. Over two decades of disciplined corporatist coordination have turned our economy into a powerhouse of industrial efficiency, rising living standards, and unwavering sovereign credit—hailed at home and abroad as a true economic miracle."
 corporatized_economy.10.f: "\"What began as an audacious experiment in state-directed syndicalism has reshaped the face of the nation for generations.\""
 corporatized_economy.10.a: "A golden age of national prosperity!"
 
 # Corporatized Agriculture Journal Entry, Amendment, Buttons & Events
 je_corporatized_agriculture: "Corporatized Agriculture"
 je_corporatized_agriculture_reason: "Soaring staple grain prices threaten urban industrial production and social stability. By dismantling antiquated agrarian arrangements and organizing estates and farms into state-supervised syndicates, the nation can secure an abundant food supply."
 je_corporatized_agriculture_goal: "Agrarian Modernization Timeline (120 Months)"
 amendment_corporatized_agriculture: "Corporatized Agriculture"
 amendment_corporatized_agriculture_desc: "Agricultural estates, ranches, and rural producers are integrated into state-directed agrarian syndicates to maximize domestic food output and rural stability.\n\n#v $ideology_corporatist$#! [Concept('concept_character', 'Characters')] are more common for the #v $ig_rural_folk$#!"
 establish_state_grain_boards_button: "Establish State Grain Boards"
 establish_state_grain_boards_button_desc: "Deploy state agricultural commissioners to regulate harvests, enforce delivery quotas, and coordinate farm output, bypassing traditional landowner autonomy."
 agrarian_mechanization_subsidies_button: "Agrarian Mechanization Subsidies"
 agrarian_mechanization_subsidies_button_desc: "Commit ongoing weekly government subsidies equal to #v 0.05%#! of [Concept('concept_gdp', 'GDP')] for #v 3 years#! to boost chemical fertilizer and agricultural engine production."
 agrarian_mechanization_subsidies_cost_tt: "Deducts #v £[GetPlayer.GetGDP|K]#! × #v 1%#! from the national [Concept('concept_treasury', 'Treasury')]"
 modifier_state_grain_boards: "State Grain Boards"
 modifier_ig_state_grain_boards_landowners: "Subordinated by State Grain Boards"
 modifier_agrarian_mechanization_subsidies: "Agrarian Mechanization Subsidies"
 modifier_corporatized_agriculture_failure: "Agrarian Supply Crisis"
 modifier_ig_corporatized_agriculture_failure: "Failed Agrarian Modernization"
 modifier_agrarian_mechanization_subsidies_cost: "Agrarian Mechanization Subsidy Outlays"

 corporatized_economy.11.t: "The Grain Question"
 corporatized_economy.11.d: "With the price of grain surging more than twenty percent above its base value, the State Planning Commission has warned that rural inefficiency threatens the entire corporatist industrial program. Ministers have been tasked with reforming land tenure and expanding agricultural output over the next decade."
 corporatized_economy.11.f: "\"No foundry can run on empty stomachs, and no modern state can leave its breadbasket chained to yesterday's customs.\""
 corporatized_economy.11.a: "Bring the countryside into the national plan."
 corporatized_economy.11.a.tt: "Open the #v Journal#! to track #v Corporatized Agriculture#! and enact agrarian decrees."

 corporatized_economy.12.t: "Agrarian Syndicates Consolidated"
 corporatized_economy.12.d: "Through decisive land reform and sustained agricultural expansion, grain prices have stabilized and rural production has been formally integrated into our corporatist framework. Commercial farmers and rural syndicates now stand as loyal pillars of the state."
 corporatized_economy.12.f: "\"From mechanized plow to state granary, the harvest now serves the entire nation.\""
 corporatized_economy.12.a: "Our breadbasket is secure."

 corporatized_economy.13.t: "Agrarian Supply Crisis"
 corporatized_economy.13.d: "Ten years of state intervention have failed to tame staple grain prices or modernize rural land tenure. Chronic food inflation has eroded living standards across the country, igniting widespread unrest among the peasantry and alienating rural leaders."
 corporatized_economy.13.f: "\"Half-built canals, unplowed fields, and empty granaries testify to a rural reform that faltered before harvest.\""
 corporatized_economy.13.a: "Brace for rural discontent."
