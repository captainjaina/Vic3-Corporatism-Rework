 # First Plan Events
 corporatized_economy.1.t: "The First Four Year Plan"
 corporatized_economy.1.d: "Under the direction of our [GetAmendmentType('amendment_corporatized_economy').GetName], the state planning commission has officially ratified the First Four Year Plan. Industrial syndicates, capital reserves, and labor ministries have been placed on a coordinated forty-eight-month schedule to expand national output and enact foundational social reforms."
 corporatized_economy.1.f: "\"Neither the blind drift of laissez-faire nor the chaos of class warfare shall dictate our nation's destiny. Every foundry, rail line, and syndicate now marches to a single blueprint.\""
 corporatized_economy.1.a: "To work—the clock has started."
 corporatized_economy.1.a.tt: "Open the #v Journal#! to pin #v First Four Year Plan#! and access state planning decrees."
 corporatized_economy.2.t: "First Four Year Plan Fulfilled"
 corporatized_economy.2.d: "After forty-eight months of coordinated state planning, the State Planning Commission has formally certified the completion of the First Four Year Plan. National output has met its benchmarks, foundational social reforms have been enacted, and sovereign credit markets have responded with renewed confidence."
 corporatized_economy.2.f: "\"What skeptics dismissed as bureaucratic hubris now stands in brick, rail, and rising living standards across the nation.\""
 corporatized_economy.2.a: "A triumph of national coordination."
 corporatized_economy.3.t: "A Miraculous Expansion"
 corporatized_economy.3.d: "The First Four Year Plan has not merely succeeded—it has shattered every projection set by the State Planning Commission. Output has surged well past initial quotas while iron and steel supplies remained plentiful, cementing unprecedented trust between state planners and industrial syndicates."
 corporatized_economy.3.f: "\"Our furnaces burn brighter, our rails stretch farther, and the world looks upon our corporatist model with a mixture of envy and dread.\""
 corporatized_economy.3.a: "Onward to greater heights!"
 corporatized_economy.4.t: "Collapse of the Four Year Plan"
 corporatized_economy.4.d: "The First Four Year Plan has ended in failure. Whether through missed production targets or the abandonment of our corporatist and protectionist framework, state planning has lost credibility. Sovereign borrowing costs have spiked, construction projects lie in disarray, and industrial magnates openly question the competence of the regime."
 corporatized_economy.4.f: "\"Unfinished foundations and unfulfilled quotas stand as silent monuments to a blueprint that collapsed under its own weight.\""
 corporatized_economy.4.a: "We must weather the fallout."

