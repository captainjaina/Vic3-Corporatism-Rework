 corporatized_economy.16.t: "A Welfare State in Blackshirts"
 corporatized_economy.16.d: "With universal literacy, public healthcare, comprehensive labor protections, and high living standards secured under a democratic corporatist constitution, the ideological fire of ultranationalist street politics has dissolved into a triumphant, state-managed socialist welfare order."
 corporatized_economy.16.f: "\"Everything within the welfare state, nothing outside the pension fund, nothing against the public school system.\""
 corporatized_economy.16.a: "Perhaps the real revolution was the social safety net we built along the way."
