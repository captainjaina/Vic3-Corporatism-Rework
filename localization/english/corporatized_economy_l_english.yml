 corporatized_economy.14.t: "The Enabling Act"
 corporatized_economy.14.d: "Citing national emergency and parliamentary deadlock, [SCOPE.sCharacter('fascist_enabling_leader').GetFullName] and the [SCOPE.sIG('fascist_enabling_ig').GetName] have introduced an Enabling Act before the legislature. Passage of the bill would grant the executive sweeping decree authority and dissolve organized party opposition, permanently reshaping the constitutional order."
 corporatized_economy.14.f: "\"In moments of existential peril, the state cannot afford the luxury of divided counsel. One nation, one will, one leadership.\""
 corporatized_economy.14.a: "Pass the Enabling Act and consolidate power."
 corporatized_economy.14.b: "Reject the bill and uphold constitutional rule."
 # Totalitarian Consolidation Flavor Event
 corporatized_economy.15.t: "The Architect of the New Order"
 corporatized_economy.15.d: "With the opposition disbanded, the presses silenced, and the security apparatus answering to a single command, no institutional check remains between [SCOPE.sCharacter('supreme_ruler_scope').GetFullName] and the nation [SCOPE.sCharacter('supreme_ruler_scope').GetSheHe] governs."
 corporatized_economy.15.f: "\"[SCOPE.sCharacter('supreme_ruler_scope').GetFullName] is now the unquestioned master of [ROOT.GetCountry.GetName]. The ministries move at [SCOPE.sCharacter('supreme_ruler_scope').GetHerHis] word; the people live by [SCOPE.sCharacter('supreme_ruler_scope').GetHerHis] design. [SCOPE.sCharacter('supreme_ruler_scope').GetSheHe|U] will reshape this nation into the paradise [SCOPE.sCharacter('supreme_ruler_scope').GetSheHe] envisions—remaking society itself, stone by stone and soul by soul, if it must be done. When the great work is finished, [SCOPE.sCharacter('supreme_ruler_scope').GetSheHe] will rest. Yet the work has scarcely begun, and a long road lies ahead...\""
 corporatized_economy.15.a: "Enter the magician"
 # National Social Democracy Journal Entry, Modifiers & Event
 je_national_social_democracy: "The Corporatist Welfare Synthesis"
 je_national_social_democracy_reason: "Under the banner of national solidarity and popular suffrage, our corporatist institutions have begun absorbing the entire social question—pensions, public healthcare, universal schooling, and labor protections—into the framework of the state. Should this grand experiment succeed, even our most ardent nationalist firebrands may discover they were Social Democrats all along."
 je_national_social_democracy_5_years_tt: "[Concept('concept_law', 'Corporate State')] or [Concept('concept_law', 'Social Monarchy')] and [Concept('concept_law', 'Census Suffrage')] or [Concept('concept_law', 'Universal Suffrage')] have been enacted together for at least #v 5 years#! (Current: #v [ROOT.GetCountry.MakeScope.Var('corporatist_social_democracy_prereq_months').GetValue|0]#! / #v 60#! months)"
 je_national_social_democracy_convert_fascists_tt: "All #v Fascist#! [Concept('concept_character', 'Characters')] in [ROOT.GetCountry.GetName] adopt the #v State Socialist#! ideology."

